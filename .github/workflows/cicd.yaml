name: Build and push docker image

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::910965283770:role/GitHubActionsNetflixECR
          aws-region: us-east-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build
        run: |
          docker build -t netflix-frontend:latest .

      - name: Docker tag
        run: |
          docker tag netflix-frontend:latest 910965283770.dkr.ecr.us-east-2.amazonaws.com/netflix-frontend:${GITHUB_RUN_NUMBER}

      - name: Docker push
        run: |
          docker push 910965283770.dkr.ecr.us-east-2.amazonaws.com/netflix-frontend:${GITHUB_RUN_NUMBER}
